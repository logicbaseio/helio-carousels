# ============================================================
# HELIO — Daily Carousel Pipeline
# SAVE THIS FILE TO: .github/workflows/daily-carousel.yml
# (Create the .github/workflows/ folder manually in your repo)
# ============================================================

name: HELIO Daily Carousel

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC = 07:00 AM PKT daily

  workflow_dispatch:
    inputs:
      topic:
        description: "Custom topic (leave empty for auto-rotation)"
        required: false
        default: ""

jobs:
  generate-and-post:
    name: Generate → Render → Upload → Post
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx puppeteer browsers install chrome

      - name: Run HELIO pipeline
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID:           ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN:      ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STORAGE_BUCKET:       ${{ secrets.STORAGE_BUCKET }}
          CUSTOM_TOPIC:         ${{ github.event.inputs.topic }}
        run: node scripts/pipeline.js

      - name: Upload slide artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carousel-slides
          path: output/*.jpg
          retention-days: 3
